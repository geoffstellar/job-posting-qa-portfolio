# QA Dashboard — two profiles for local container testing.
#
#   docker compose up                          # sqlite profile (default)
#   docker compose --profile postgres up       # postgres profile
#
# Both profiles build from the same Dockerfile — only the DATABASE_URL
# and the presence of a `db` service differ. Named volumes persist data
# across container restarts; `docker compose down -v` wipes them.

services:
  # ── sqlite profile (default, pilot equivalent) ───────────────────────────
  # What Fly.io's initial deploy will look like: one container, one volume,
  # schema migrations on every boot. SQLite is fine for this app's write
  # volume (one fetch/day + interactive UI).
  app:
    build: .
    image: cedarline-qa-dashboard:local
    profiles: ["sqlite", ""]
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      # sqlite:////app/data/qa_tickets.db — four slashes = absolute path.
      # APP_DATA_DIR is set in the Dockerfile, but listing DATABASE_URL
      # explicitly makes the config readable at a glance.
      DATABASE_URL: "sqlite:////app/data/qa_tickets.db"
      FLASK_ENV: "production"
      # Session secret + admin creds MUST be supplied via .env or host env.
      # docker compose auto-reads .env from the project directory.
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env before docker compose up}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-changeme-first-boot}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      QA_MIN_INTERVAL_SEC: "${QA_MIN_INTERVAL_SEC:-13}"
    volumes:
      - qa_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── postgres profile (Azure cutover preview) ─────────────────────────────
  # Run Alembic against a real Postgres to catch any SQLite-isms in schema
  # before cutover. Note: runtime query layer is still SQLite-dialect in
  # Phase 2; full Postgres runtime support is a later PR. Migrations work
  # today.
  app-postgres:
    build: .
    image: cedarline-qa-dashboard:local
    profiles: ["postgres"]
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      DATABASE_URL: "postgresql+psycopg://qa:${POSTGRES_PASSWORD:-qa_dev}@db:5432/qa_tickets"
      FLASK_ENV: "production"
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY in .env before docker compose up}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-changeme-first-boot}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      QA_MIN_INTERVAL_SEC: "${QA_MIN_INTERVAL_SEC:-13}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: "qa"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qa_dev}"
      POSTGRES_DB: "qa_tickets"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_tickets"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qa_data:
  postgres_data:
